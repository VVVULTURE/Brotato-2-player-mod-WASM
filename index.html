<!DOCTYPE html>
<html xmlns='http://www.w3.org/1999/xhtml' lang='' xml:lang=''>
<head>
	<meta charset='utf-8' />
	<meta name='viewport' content='width=device-width, user-scalable=no' />
	<title>Brotato</title>
	<style type='text/css'>

		/*
		 * All sizes defined at 1920x1080. JS sets --scale = min(vw/1920, vh/1080)
		 * so everything scales proportionally from that baseline.
		 */
		:root { --scale: 1; }

		html, body { width: 100%; height: 100%; }

		body {
			touch-action: none;
			margin: 0;
			border: 0 none;
			padding: 0;
			text-align: center;
			background-color: black;
			overflow: hidden;
		}

		#canvas {
			display: block;
			margin: 0;
			color: white;
		}

		#canvas:focus {
			outline: none;
		}

		.godot {
			font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
			color: #e0e0e0;
			background-color: #3b3943;
			background-image: linear-gradient(to bottom, #403e48, #35333c);
			border: 1px solid #45434e;
			box-shadow: 0 0 1px 1px #2f2d35;
		}


		/* Status display
		 * ============== */

		#status {
			position: absolute;
			left: 0;
			top: 0;
			right: 0;
			bottom: 0;
			display: flex;
			flex-direction: column;
			justify-content: center;
			align-items: center;
			gap: calc(36px * var(--scale));
			/* don't consume click events - make children visible explicitly */
			visibility: hidden;
		}

		/* Logo row: icon + name side by side */
		#status-logo {
			display: flex;
			flex-direction: row;
			align-items: center;
			gap: calc(30px * var(--scale));
			visibility: visible;
		}

		#status-logo img {
			display: block;
		}

		/* Icon: 340px at 1080p */
		#status-logo-icon {
			width: calc(340px * var(--scale));
			height: calc(340px * var(--scale));
			image-rendering: pixelated;
		}

		/* Name: 230px tall at 1080p */
		#status-logo-name {
			height: calc(230px * var(--scale));
			width: auto;
			image-rendering: pixelated;
		}

		/* Progress wrapper: percentage label + bar stacked */
		#status-progress-wrap {
			display: none;
			flex-direction: column;
			align-items: flex-end;
			gap: calc(8px * var(--scale));
			visibility: visible;
		}

		#status-percent {
			font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
			font-size: calc(28px * var(--scale));
			font-weight: bold;
			color: #dfdfdf;
			letter-spacing: 0.05em;
			min-width: calc(80px * var(--scale));
			text-align: right;
			text-shadow: 0 0 10px #000;
		}

		/* Bar: 1400px wide x 30px tall at 1080p */
		#status-progress {
			width: calc(1400px * var(--scale));
			height: calc(30px * var(--scale));
			background-color: #38363A;
			border: calc(2px * var(--scale)) solid #444246;
			padding: calc(3px * var(--scale));
			box-shadow: 0 0 calc(4px * var(--scale)) calc(2px * var(--scale)) #1B1C22;
			border-radius: calc(6px * var(--scale));
			visibility: visible;
			box-sizing: border-box;
		}

		@media only screen and (orientation:portrait) {
			#status-progress { width: 85vw; }
			#status-progress-wrap { width: 85vw; }
		}

		#status-progress-inner {
			height: 100%;
			width: 0;
			box-sizing: border-box;
			transition: width 0.5s linear;
			background-color: #202020;
			border: calc(1px * var(--scale)) solid #222223;
			box-shadow: 0 0 calc(2px * var(--scale)) calc(1px * var(--scale)) #27282E;
			border-radius: calc(4px * var(--scale));
		}

		#status-indeterminate {
			height: calc(80px * var(--scale));
			visibility: visible;
			position: relative;
		}

		#status-indeterminate > div {
			width: calc(9px * var(--scale));
			height: 0;
			border-style: solid;
			border-width: calc(18px * var(--scale)) calc(6px * var(--scale)) 0 calc(6px * var(--scale));
			border-color: #2b2b2b transparent transparent transparent;
			transform-origin: center calc(40px * var(--scale));
			position: absolute;
		}

		#status-indeterminate > div:nth-child(1) { transform: rotate( 22.5deg); }
		#status-indeterminate > div:nth-child(2) { transform: rotate( 67.5deg); }
		#status-indeterminate > div:nth-child(3) { transform: rotate(112.5deg); }
		#status-indeterminate > div:nth-child(4) { transform: rotate(157.5deg); }
		#status-indeterminate > div:nth-child(5) { transform: rotate(202.5deg); }
		#status-indeterminate > div:nth-child(6) { transform: rotate(247.5deg); }
		#status-indeterminate > div:nth-child(7) { transform: rotate(292.5deg); }
		#status-indeterminate > div:nth-child(8) { transform: rotate(337.5deg); }

		#status-notice {
			margin: 0 calc(100px * var(--scale));
			line-height: 1.3;
			font-size: calc(20px * var(--scale));
			visibility: visible;
			padding: calc(8px * var(--scale)) calc(12px * var(--scale));
		}
	</style>
<link id='-gd-engine-icon' rel='icon' type='image/png' href='index.icon.png' />
<link rel='apple-touch-icon' href='index.apple-touch-icon.png'/>

<script>
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('coi-serviceworker.js').then(function(reg) {
      if (!navigator.serviceWorker.controller) { window.location.reload(); }
    });
  }
</script>
</head>
<body>
	<canvas id='canvas'>
		HTML5 canvas appears to be unsupported in the current browser.<br />
		Please try updating or use a different browser.
	</canvas>
	<div id='status'>
		<!-- Logo: icon on the left, name image on the right -->
		<div id='status-logo'>
			<img id='status-logo-icon' src='index.apple-touch-icon.png' alt='Brotato icon' />
			<img id='status-logo-name' src='logo.webp' alt='Brotato' />
		</div>

		<!-- Progress bar with percentage label above-right -->
		<div id='status-progress-wrap' oncontextmenu='event.preventDefault();'>
			<span id='status-percent'>0%</span>
			<div id='status-progress'><div id='status-progress-inner'></div></div>
		</div>

		<div id='status-indeterminate' style='display: none;' oncontextmenu='event.preventDefault();'>
			<div></div>
			<div></div>
			<div></div>
			<div></div>
			<div></div>
			<div></div>
			<div></div>
			<div></div>
		</div>
		<div id='status-notice' class='godot' style='display: none;'></div>
	</div>

	<!-- Scale loading screen to 1920x1080 baseline -->
	<script type='text/javascript'>
		(function() {
			function applyScale() {
				var s = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
				document.documentElement.style.setProperty('--scale', s);
			}
			applyScale();
			window.addEventListener('resize', applyScale);
		})();
	</script>

	<script type='text/javascript' src='index.js'></script>
	<script type='text/javascript'>//<![CDATA[

		const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":147596720,"index.wasm":26156492},"focusCanvas":true,"gdnativeLibs":[]};
		var engine = new Engine(GODOT_CONFIG);

		(function() {
			const INDETERMINATE_STATUS_STEP_MS = 100;
			var statusProgressWrap = document.getElementById('status-progress-wrap');
			var statusProgressInner = document.getElementById('status-progress-inner');
			var statusPercent = document.getElementById('status-percent');
			var statusIndeterminate = document.getElementById('status-indeterminate');
			var statusNotice = document.getElementById('status-notice');

			var initializing = true;
			var statusMode = 'hidden';

			var animationCallbacks = [];
			function animate(time) {
				animationCallbacks.forEach(callback => callback(time));
				requestAnimationFrame(animate);
			}
			requestAnimationFrame(animate);

			function setStatusMode(mode) {

				if (statusMode === mode || !initializing)
					return;
				[statusProgressWrap, statusIndeterminate, statusNotice].forEach(elem => {
					elem.style.display = 'none';
				});
				animationCallbacks = animationCallbacks.filter(function(value) {
					return (value != animateStatusIndeterminate);
				});
				switch (mode) {
					case 'progress':
						statusProgressWrap.style.display = 'flex';
						break;
					case 'indeterminate':
						statusIndeterminate.style.display = 'block';
						animationCallbacks.push(animateStatusIndeterminate);
						break;
					case 'notice':
						statusNotice.style.display = 'block';
						break;
					case 'hidden':
						break;
					default:
						throw new Error('Invalid status mode');
				}
				statusMode = mode;
			}

			function animateStatusIndeterminate(ms) {
				var i = Math.floor(ms / INDETERMINATE_STATUS_STEP_MS % 8);
				if (statusIndeterminate.children[i].style.borderTopColor == '') {
					Array.prototype.slice.call(statusIndeterminate.children).forEach(child => {
						child.style.borderTopColor = '';
					});
					statusIndeterminate.children[i].style.borderTopColor = '#dfdfdf';
				}
			}

			function setStatusNotice(text) {
				while (statusNotice.lastChild) {
					statusNotice.removeChild(statusNotice.lastChild);
				}
				var lines = text.split('\n');
				lines.forEach((line) => {
					statusNotice.appendChild(document.createTextNode(line));
					statusNotice.appendChild(document.createElement('br'));
				});
			};

			function displayFailureNotice(err) {
				var msg = err.message || err;
				console.error(msg);
				setStatusNotice(msg);
				setStatusMode('notice');
				initializing = false;
			};

			if (!Engine.isWebGLAvailable()) {
				displayFailureNotice('WebGL not available');
			} else {
				setStatusMode('indeterminate');
				engine.startGame({
					'onProgress': function (current, total) {
						if (total > 0) {
							var pct = Math.round(current / total * 100);
							statusProgressInner.style.width = pct + '%';
							statusPercent.textContent = pct + '%';
							setStatusMode('progress');
							if (current === total) {
								// wait for progress bar animation
								setTimeout(() => {
									setStatusMode('indeterminate');
								}, 500);
							}
						} else {
							setStatusMode('indeterminate');
						}
					},
				}).then(() => {
					setStatusMode('hidden');
					initializing = false;
				}, displayFailureNotice);
			}
		})();
	//]]></script>
</body>
</html>
